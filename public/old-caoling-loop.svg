    <text x="135" y="357" font-size="35">🚉</text><text x="135" y="407" font-size="17" fill="#29483c" font-weight="700">福隆火車站</text>
    <g filter="url(#shadow)"><circle cx="235" cy="399" r="20" fill="#557a56"/><text x="235" y="406" font-size="20" fill="white" font-weight="700">2</text></g>
    <text x="279" y="393" font-size="32">🚲</text><text x="279" y="439" font-size="15" fill="#29483c" font-weight="700">隧道北口・制天險</text>
    <g filter="url(#shadow)"><circle cx="373" cy="359" r="20" fill="#557a56"/><text x="373" y="366" font-size="20" fill="white" font-weight="700">3</text></g>
    <text x="418" y="346" font-size="31">🚇</text><text x="418" y="389" font-size="15" fill="#29483c" font-weight="700">隧道南口・白雲飛處</text>
    <g filter="url(#shadow)"><circle cx="485" cy="322" r="20" fill="#557a56"/><text x="485" y="329" font-size="20" fill="white" font-weight="700">4</text></g>
    <text x="524" y="306" font-size="31">🔭</text><text x="524" y="348" font-size="16" fill="#29483c" font-weight="700">石城觀景點</text>
    <g filter="url(#shadow)"><circle cx="603" cy="282" r="20" fill="#557a56"/><text x="603" y="289" font-size="20" fill="white" font-weight="700">5</text></g>
    <text x="640" y="271" font-size="31">🪨</text><text x="640" y="310" font-size="16" fill="#29483c" font-weight="700">萊萊地質區</text>
    <g filter="url(#shadow)"><circle cx="704" cy="240" r="20" fill="#557a56"/><text x="704" y="247" font-size="20" fill="white" font-weight="700">6</text></g>
