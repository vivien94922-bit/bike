    <g filter="url(#shadow)"><circle cx="808" cy="201" r="20" fill="#557a56"/><text x="808" y="208" font-size="20" fill="white" font-weight="700">7</text></g>
    <text x="844" y="190" font-size="31">🗼</text><text x="844" y="231" font-size="16" fill="#29483c" font-weight="700">三貂角燈塔</text>
    <g filter="url(#shadow)"><circle cx="923" cy="267" r="20" fill="#557a56"/><text x="923" y="274" font-size="20" fill="white" font-weight="700">8</text></g>
    <text x="966" y="252" font-size="31">🏘️</text><text x="966" y="295" font-size="15" fill="#29483c" font-weight="700">馬崗社區</text>
    <g filter="url(#shadow)"><circle cx="1015" cy="363" r="20" fill="#557a56"/><text x="1015" y="370" font-size="20" fill="white" font-weight="700">9</text></g>
    <text x="1050" y="352" font-size="31">🐟</text><text x="1050" y="393" font-size="16" fill="#29483c" font-weight="700">卯澳漁村</text>
    <text x="879" y="426" font-size="28">🍱</text><text x="879" y="466" font-size="15" fill="#29483c" font-weight="700">福隆便當・回到起點</text>
  </g>
  <g transform="translate(100 42)"><rect width="337" height="74" rx="18" fill="#fffdf5" stroke="#d7e1ca"/><text x="24" y="30" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="700" fill="#365647">騎一圈，收藏山海風景 🌿</text><text x="24" y="55" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#74877a">舊草嶺環狀線・約 20 公里路線示意</text></g>
  <g transform="translate(32 500)"><circle cx="20" cy="20" r="18" fill="#557a56"/><text x="20" y="26" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white" font-weight="700">1</text><text x="50" y="26" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#365647">起點／終點：福隆火車站</text><text x="435" y="26" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#74877a">路線非按比例繪製，部分路段有坡度，請依體力安排行程。</text></g>
</svg>
