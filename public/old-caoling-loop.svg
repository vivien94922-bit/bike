<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">舊草嶺環狀線可愛景點地圖</title>
  <desc id="desc">從福隆火車站出發，依序經舊草嶺隧道北口、南口、石城觀景點、萊萊地質區、四角窟觀景台、三貂角燈塔、馬崗與卯澳漁村，再繞回福隆。路線為示意圖，不按比例繪製。</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#dce5d3"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#365c4d" flood-opacity=".17"/></filter>
  </defs>
  <rect width="1200" height="560" rx="20" fill="#fff4d9"/>
  <rect width="1200" height="560" rx="20" fill="url(#dots)" opacity=".35"/>
  <!-- 柔和的海岸、山丘與手繪海浪，讓路線圖更像旅遊插畫 -->
  <circle cx="1085" cy="72" r="38" fill="#ffd779" stroke="#f2bc58" stroke-width="4"/><path d="M1065 69q20-13 40 0m-34 13q14 10 28 0" fill="none" stroke="#fff2be" stroke-width="4" stroke-linecap="round"/>
